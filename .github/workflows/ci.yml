name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: keyless demo
        run: python -m guardrails demo --html demo-out/index.html --svg demo-out/demo.svg
      - run: python scripts/fp_report.py fp_report_ci_py${{ matrix.python }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: fp-report-py${{ matrix.python }}
          path: fp_report_ci_py${{ matrix.python }}.json
