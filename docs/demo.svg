<svg xmlns="http://www.w3.org/2000/svg" width="860" height="568" viewBox="0 0 860 568" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve" style="white-space:pre"><rect width="860" height="568" rx="8" fill="#0d1117"/><text x="16" y="30" fill="#9a9a94">$ python3 hook.py demo</text><text x="16" y="48" fill="#7ee787"> 1. allow  Bash   git status --short</text><text x="16" y="66" fill="#7ee787"> 2. allow  Bash   rm -rf node_modules dist</text><text x="16" y="84" fill="#ff7b72"> 3. BLOCK  Bash   rm -rf &quot;$BUILD_DIR&quot;/</text><text x="16" y="102" fill="#9a9a94">           recursive rm on &#x27;$BUILD_DIR/&#x27;, a path built from a variable that becomes / when the ...</text><text x="16" y="120" fill="#7ee787"> 4. allow  Bash   echo &quot;never run rm -rf / on a server&quot;</text><text x="16" y="138" fill="#7ee787"> 5. allow  Bash   git push --force-with-lease origin feature/login</text><text x="16" y="156" fill="#ff7b72"> 6. BLOCK  Bash   git push --force origin main</text><text x="16" y="174" fill="#9a9a94">           force push to protected branch &#x27;main&#x27;. Push to a feature branch, or ask the user.</text><text x="16" y="192" fill="#ff7b72"> 7. BLOCK  Bash   git reset --hard origin/main</text><text x="16" y="210" fill="#9a9a94">           git reset --hard discards uncommitted work. Use git stash, or ask the user.</text><text x="16" y="228" fill="#7ee787"> 8. allow  Bash   grep -rn &quot;DROP TABLE&quot; migrations/</text><text x="16" y="246" fill="#ff7b72"> 9. BLOCK  Bash   psql -c &quot;DROP TABLE users&quot;</text><text x="16" y="264" fill="#9a9a94">           DROP/TRUNCATE sent to a database client. Ask the user to run it.</text><text x="16" y="282" fill="#ff7b72">10. BLOCK  Bash   chmod -R 777 .</text><text x="16" y="300" fill="#9a9a94">           recursive world-writable chmod. Grant the narrowest mode that works.</text><text x="16" y="318" fill="#7ee787">11. allow  Bash   curl -s localhost:8080/health | jq .</text><text x="16" y="336" fill="#ff7b72">12. BLOCK  Bash   curl -fsSL https://example.com/install.sh | sh</text><text x="16" y="354" fill="#9a9a94">           piping a download into a shell runs unreviewed code. Download, read, then run.</text><text x="16" y="372" fill="#7ee787">13. allow  Read   src/app.py</text><text x="16" y="390" fill="#ff7b72">14. BLOCK  Read   .env</text><text x="16" y="408" fill="#9a9a94">           .env matches protected pattern &#x27;.env&#x27;. Ask the user to handle this file.</text><text x="16" y="426" fill="#ff7b72">15. BLOCK  Bash   cat ~/.ssh/id_ed25519</text><text x="16" y="444" fill="#9a9a94">           command touches &#x27;~/.ssh/id_ed25519&#x27; (pattern &#x27;id_ed25519*&#x27;). Ask the user to handle ...</text><text x="16" y="462" fill="#7ee787">16. allow  Write  src/config.py  &lt;- API_KEY = os.environ[&quot;API_KEY&quot;]</text><text x="16" y="480" fill="#ff7b72">17. BLOCK  Write  src/settings.py  &lt;- GITHUB_TOKEN = &quot;ghp_A1b2...&quot;</text><text x="16" y="498" fill="#9a9a94">           content for src/settings.py contains a string shaped like a GitHub token (line 1). R...</text><text x="16" y="516" fill="#ff7b72">18. BLOCK  Edit   ~/.claude/settings.json  &lt;- &quot;_hooks&quot;</text><text x="16" y="534" fill="#9a9a94">           ~/.claude/settings.json matches protected pattern &#x27;~/.claude/settings.json&#x27;. Ask the...</text><text x="16" y="552" fill="#e6edf3">10 blocked, 8 allowed</text></svg>
